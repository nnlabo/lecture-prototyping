<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokeapi_sample</title>
  </head>
  <body style="background-color: #f5f5f5;">
    <div class="container">
      <div>
        <h1>ポケモンをゲットしよう！</h1>
        <p>番号を入力(1〜1008)</p>
        <input type="text" value="25" class="form-text"/>
        <button id="getbutton" class="btn btn-primary">Get</button>
      </div>

      <div>
        <p id="pokemonName"></p>
        <img src="" alt="getしたポケモンの画像" style="height: 200px;"/>
      </div>
      <div>
        <textarea rows="5" cols="40" placeholder="説明表示エリア" style="background-color: lightgray;" disabled></textarea>
      </div>
      <div>
        <button id="generatebutton" class="btn btn-secondary">(option)生成ボタン</button>
      </div>
    </div>
    <script>
      const url = "https://pokeapi.co/api/v2/pokemon/";
      
      // Getボタンをクリックした時の処理
      const nameLabel = document.getElementById("pokemonName");
      const img = document.getElementsByTagName("img")[0];
      const getBtn = document.getElementById("getbutton");
      getBtn.addEventListener("click", () => {
        let pokemonNumber = document.getElementsByTagName("input")[0].value;
        fetch(url + pokemonNumber)
        .then((res) => res.json())
        .then((jsonData) => {
          nameLabel.innerText = jsonData.name;
          // Option①: 他の属性を指定して違う画像を表示してみる
          img.src = jsonData.sprites.front_default;
        });
      });
      
      const API_KEY = "";  // APIキーは流出しないように注意してください *ここに記述したままにしないなど。
      const MODEL_NAME = "gemini-2.5-flash-lite";
      const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
      
      // AIにテキスト生成してもらう関数
      async function generateText(promptText) {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": `${API_KEY}`
          },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: promptText }] }],
          }),
        });

        const data = await response.json();
        console.log(data.candidates[0].content.parts[0].text);
        return data.candidates[0].content.parts[0].text;
      }
      // 生成ボタンをクリックしたときの処理
      const textArea = document.getElementsByTagName("textarea")[0];
      const generateBtn = document.getElementById("generatebutton");
      generateBtn.addEventListener("click", async() => {
        // Option②: AIにポケモンの説明を生成してもらい、textareaに表示してみる
        textArea.innerText = "ポケモン。それは不思議な生き物。ポケットモンスター。縮めて、ポケモン. (定型文です)";
        // textArea.innerText = await generateText(`${nameLabel.innerText}というポケモンの説明を100字以内で生成してください。`);
      });
    </script>
  </body>

  <style>
    .container {
      text-align: center;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 5px;
      background: #4676D7;
      color: #fff;
      padding: 8px 16px;
      font-size: 16px;
    }

    button:hover {
      background: #1d49aa;
    }
     
    button:focus {
      outline: none;
      box-shadow: 0 0 0 4px #cbd6ee;
    }
    
  </style>
</html>
